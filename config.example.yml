# Advanced configuration of frigate-telegram-enhanced — OPTIONAL.
#
# A normal installation does not need it: everything is set with the environment
# variables of docker-compose.yml, then in the web interface.
#
# To use this file instead: copy it to config/config.yml, adapt it, and add the
# volume "- ./config:/config:ro" to the service. When /config/config.yml exists,
# it is the only one taken into account.
#
# ${VAR} values come from the container's environment variables (environment
# section of the compose file); ${VAR:-default} uses "default" when it is not set.

language: en                     # language of Telegram messages and errors: en, fr (see internal/i18n/locales)
timezone: Europe/Paris
mode: events                     # events (one message per object) or reviews (Frigate ≥ 0.14 alerts)

frigate:
  url: http://frigate:5000       # internal API URL (5000 without auth, 8971 with auth)
  external_url: ""               # address of the "Open in Frigate" links (empty: the one of url)
  username: ""                   # fill in if Frigate authentication is enabled
  password: "${FRIGATE_PASSWORD:-}"
  insecure_skip_verify: false    # true for a self-signed certificate

mqtt:
  broker: tcp://mosquitto:1883   # ssl://host:8883 for TLS
  username: ""
  password: "${MQTT_PASSWORD:-}"
  client_id: frigate-telegram-enhanced
  topic_prefix: frigate          # must match Frigate's mqtt.topic_prefix

telegram:
  token: "${TELEGRAM_TOKEN}"
  admins: [123456789]            # IDs of the users allowed to control the bot
  chats:                         # free names → chat IDs
    me: 123456789
    # family: -1001234567890     # a group has a negative ID

web:                             # notification settings interface, on http_listen
  enabled: true
  password: "${WEB_PASSWORD:-}"  # empty = no authentication (then only expose it on 127.0.0.1)
  # Without a password, the interface only accepts IP addresses and localhost in the
  # URL (protection against DNS rebinding). To open it by a host name
  # (http://nas.lan:8431), add it here — or set a password.
  allowed_hosts: []
  protect_metrics: false         # true = /metrics also requires the password (to set on the Prometheus side)

# The notify and cameras sections below are the ones the web interface changes. From
# the first save on, it writes /data/notify.yml, which replaces both of them; this
# file stays the source of the secrets and the ${VAR}. The interface's "Back to the
# config.yml settings" button deletes /data/notify.yml.

notify:                          # global settings, can be overridden per camera
  chats: [me]
  labels: [person, car]          # empty = every object
  zones: []                      # empty = no zone constraint
  min_score: 0.7                 # or per label: {person: 0.7, car: 0.85}
  cooldown: 60s                  # minimum delay between two camera+object notifications
  ignore_stationary: true        # ignore stationary objects (parked cars…)
  severity: [alert]              # reviews mode: alert and/or detection
  snapshot: true
  crop: false                    # true = image cropped on the object (much more readable on a phone)
  clip: true
  media_in_place: true           # the video (or GIF) replaces the image in the same message; false = as a reply
  gif: false
  genai_description: true        # adds Frigate's GenAI description when it arrives
  clip_delay: 5s                 # wait after the end of the event before fetching the clip
  quiet_hours:                   # silent notifications
    - {from: "22:00", to: "07:00"}
  off_hours: []                  # no notification
  when_home: skip                # when someone is home (see presence): notify, silent or skip
  group: 0s                      # groups bursts over this delay (e.g. 2m): one updated message; global setting
  ignore_sub_labels: []          # Frigate labels not to notify, e.g. ["clio 3 océane", ohana]
  ignore_known: false            # true = unknown objects only (any labeled object is ignored)
  sub_label_wait: 5s             # with a label filter: maximum wait for the label

# Presence (optional): someone is home as soon as one of these MQTT topics carries one
# of the home_values. Wildcards + and # accepted. With Home Assistant, publish the
# state of the persons (mqtt_statestream, or an automation).
# presence:
#   topics: ["homeassistant/person/+/state"]
#   home_values: [home, on, true, "1", present]   # default values

# Per-recipient restrictions (optional), on top of the cameras' settings.
# recipients:
#   family:
#     labels: [person]                          # people only
#     off_hours: [{from: "07:00", to: "22:00"}] # at night only
#     quiet_hours: []

cameras:
  jardin:
    zones: [allee, portail]
  garage:
    labels: [person]
    min_score: 0.8
  salon:
    enabled: false

state_file: /data/state.json
http_listen: ":8431"
log_level: info                  # debug, info, warn, error
