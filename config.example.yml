# Configuration avancée de frigate-telegram-enhanced — FACULTATIVE.
#
# L'installation normale n'en a pas besoin : tout se règle par les variables
# d'environnement de docker-compose.yml, puis dans l'interface web.
#
# Pour utiliser ce fichier à la place : le copier vers config/config.yml, l'adapter,
# et ajouter au service le volume « - ./config:/config:ro ». Quand
# /config/config.yml existe, il est seul pris en compte.
#
# Les valeurs ${VAR} viennent des variables d'environnement du conteneur (section
# environment du compose) ; ${VAR:-défaut} utilise « défaut » si elle n'est pas définie.

language: en                     # langue des messages Telegram et des erreurs : en, fr (voir internal/i18n/locales)
timezone: Europe/Paris
mode: events                     # events (un message par objet) ou reviews (alertes Frigate ≥ 0.14)

frigate:
  url: http://frigate:5000       # URL interne de l'API (5000 sans auth, 8971 avec auth)
  external_url: ""               # adresse des liens « Ouvrir dans Frigate » (vide : celle de url)
  username: ""                   # renseigner si l'authentification Frigate est activée
  password: "${FRIGATE_PASSWORD:-}"
  insecure_skip_verify: false    # true pour un certificat auto-signé

mqtt:
  broker: tcp://mosquitto:1883   # ssl://hôte:8883 pour du TLS
  username: ""
  password: "${MQTT_PASSWORD:-}"
  client_id: frigate-telegram-enhanced
  topic_prefix: frigate          # doit correspondre à mqtt.topic_prefix de Frigate

telegram:
  token: "${TELEGRAM_TOKEN}"
  admins: [123456789]            # identifiants des utilisateurs autorisés à piloter le bot
  chats:                         # noms libres → identifiants de chat
    moi: 123456789
    # famille: -1001234567890    # un groupe a un identifiant négatif

web:                             # interface de réglage des notifications, sur http_listen
  enabled: true
  password: "${WEB_PASSWORD:-}"  # vide = aucune authentification (ne l'exposer alors que sur 127.0.0.1)
  # Sans mot de passe, l'interface n'accepte que les adresses IP et localhost dans
  # l'URL (protection contre le rebinding DNS). Pour l'ouvrir par un nom d'hôte
  # (http://nas.lan:8431), l'ajouter ici — ou définir un mot de passe.
  allowed_hosts: []
  protect_metrics: false         # true = /metrics exige aussi le mot de passe (à renseigner côté Prometheus)

# Les sections notify et cameras ci-dessous sont celles que l'interface web modifie.
# Dès le premier enregistrement, elle écrit /data/notify.yml, qui les remplace toutes
# les deux ; ce fichier-ci reste la source des secrets et des ${VAR}. Le bouton
# « Revenir à config.yml » de l'interface supprime /data/notify.yml.

notify:                          # réglages globaux, surchargeables par caméra
  chats: [moi]
  labels: [person, car]          # vide = tous les objets
  zones: []                      # vide = pas de contrainte de zone
  min_score: 0.7                 # ou par label : {person: 0.7, car: 0.85}
  cooldown: 60s                  # délai minimum entre deux notifications caméra+objet
  ignore_stationary: true        # ignorer les objets immobiles (voitures garées…)
  severity: [alert]              # mode reviews : alert et/ou detection
  snapshot: true
  crop: false                    # true = image recadrée sur l'objet (bien plus lisible sur téléphone)
  clip: true
  media_in_place: true           # la vidéo (ou le GIF) remplace l'image dans le même message ; false = en réponse
  gif: false
  genai_description: true        # ajoute la description GenAI de Frigate quand elle arrive
  clip_delay: 5s                 # attente après la fin de l'événement avant de récupérer le clip
  quiet_hours:                   # notifications sans son
    - {from: "22:00", to: "07:00"}
  off_hours: []                  # aucune notification
  when_home: skip                # quand quelqu'un est à la maison (voir presence) : notify, silent ou skip
  group: 0s                      # regroupe les rafales sur ce délai (ex. 2m) : un message mis à jour ; réglage global
  ignore_sub_labels: []          # étiquettes de Frigate à ne pas notifier, ex. ["clio 3 océane", ohana]
  ignore_known: false            # true = seulement les inconnus (tout objet étiqueté est ignoré)
  sub_label_wait: 5s             # avec un filtre d'étiquettes : attente maximale de l'étiquette

# Présence (facultatif) : quelqu'un est à la maison dès qu'un de ces topics MQTT
# porte une des valeurs de home_values. Jokers + et # acceptés. Avec Home Assistant,
# publier l'état des personnes (mqtt_statestream, ou une automatisation).
# presence:
#   topics: ["homeassistant/person/+/state"]
#   home_values: [home, on, true, "1", present]   # valeurs par défaut

# Restrictions par destinataire (facultatif), en plus des réglages des caméras.
# recipients:
#   famille:
#     labels: [person]                          # seulement les personnes
#     off_hours: [{from: "07:00", to: "22:00"}] # seulement la nuit
#     quiet_hours: []

cameras:
  jardin:
    zones: [allee, portail]
  garage:
    labels: [person]
    min_score: 0.8
  salon:
    enabled: false

state_file: /data/state.json
http_listen: ":8431"
log_level: info                  # debug, info, warn, error
