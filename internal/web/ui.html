<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S10 19 10 13'/%3E%3Cpath d='M14.3 24.5a2 2 0 0 0 3.4 0'/%3E%3C/g%3E%3C/svg%3E">
<title>frigate-telegram-enhanced — notifications</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
      <div class="brand-text">
        <h1 data-t="Frigate notifications">Frigate notifications</h1>
        <span class="sub">frigate-telegram-enhanced</span>
      </div>
    </div>
    <span class="spacer"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <span class="lang" role="group" aria-label="Language / Langue">
    </span>
  </div>
</header>
<div class="layout">
<nav class="toc" id="toc" aria-label="Sections">
  <p class="toc-title" data-t="On this page"></p>
  <ol>
    <li><a href="#state-box" data-target="state-box"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg><span data-t="Status"></span></a></li>
    <li><a href="#sec-style" data-target="sec-style"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-t="Notification style"></span></a></li>
    <li><a href="#sec-when" data-target="sec-when"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="When"></span></a></li>
    <li><a href="#recipients-box" data-target="recipients-box"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-t="Recipients"></span></a></li>
    <li><a href="#sec-cameras" data-target="sec-cameras"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg><span data-t="Cameras"></span></a></li>
    <li><a href="#activity-box" data-target="activity-box"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span data-t="Recent activity"></span></a></li>
    <li><a href="#advanced" data-target="advanced"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-t="Advanced settings"></span></a></li>
  </ol>
</nav>
<main>
  <div id="messages"></div>

  <section id="state-box" hidden>
    <div class="live" id="live" hidden></div>
    <div class="health" id="health" hidden></div>
    <div class="health-errors" id="health-errors" hidden></div>
  </section>

  <section id="sec-style">
    <div class="sec-head">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <div>
        <h2 data-t="What should your notifications look like?"></h2>
        <p class="lead" data-t="Pick a style: every camera uses it, except the ones you set differently below."></p>
      </div>
    </div>
    <div class="styles" id="styles"></div>
    <div class="framing" id="framing"></div>
    <div class="try" id="try"></div>
  </section>

  <section id="sec-when">
    <div class="sec-head">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <div><h2 data-t="When should you be notified?"></h2></div>
    </div>
    <div class="body" id="questions"></div>
  </section>

  <section id="recipients-box" hidden>
    <div class="sec-head">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <div>
        <h2 data-t="Recipients"></h2>
        <p class="lead" data-t="By default, everyone receives everything the cameras send. Here, limit someone to some objects or some hours."></p>
      </div>
    </div>
    <div id="recipients"></div>
  </section>

  <section id="sec-cameras">
    <div class="sec-head">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></span>
      <div>
        <h2 data-t="Cameras"></h2>
        <p class="lead" data-t="Turn a camera on or off, or open it to give it another style."></p>
      </div>
    </div>
    <div id="cameras"></div>
  </section>

  <section id="activity-box" hidden>
    <div class="sec-head">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
      <div>
        <h2 data-t="Recent activity"></h2>
        <p class="lead" data-t="Frigate's latest detections and what happened to them — handy to understand why a notification didn't arrive."></p>
      </div>
    </div>
    <ul class="activity" id="activity"></ul>
    <div class="activity-foot" id="activity-foot"></div>
  </section>

  <details class="advanced" id="advanced">
    <summary>
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
      <span class="t" data-t="Advanced settings"></span>
    </summary>
    <div class="body">
      <p class="hint" data-t="Every setting, for what the choices above don't cover. They apply to every camera, unless it has its own."></p>
      <div id="global"></div>
    </div>
  </details>

  <footer>
    <span id="mode"></span><span>·</span><span id="tz"></span>
    <span class="spacer"></span>
    <a class="link" id="connection" href="setup" hidden data-t="Connection"></a>
    <button class="link danger" id="reset" data-t="Back to the config.yml settings"></button>
  </footer>
</main>
</div>


<script src="i18n.js"></script>
<script src="ui.js"></script>
</body>
</html>
