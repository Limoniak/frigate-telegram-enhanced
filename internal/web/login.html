<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S10 19 10 13'/%3E%3Cpath d='M14.3 24.5a2 2 0 0 0 3.4 0'/%3E%3C/g%3E%3C/svg%3E">
<title>{{.Title}}</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="login">
<form class="login-card" method="post" action="login?lang={{.Lang}}">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
    <div class="brand-text">
      <h1>{{.Title}}</h1>
      <span class="sub">frigate-telegram-enhanced</span>
    </div>
  </div>
  <label for="password">{{.Label}}</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
  <input type="hidden" name="next" value="{{.Next}}">
  {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
  <button type="submit" class="primary">{{.Button}}</button>
  <nav class="login-langs" aria-label="Language / Langue">{{range .Langs}}<a href="login?lang={{.Code}}&amp;next={{$.Next}}"{{if .Current}} aria-current="true"{{end}}>{{.Code}}</a>{{end}}</nav>
</form>
</body>
</html>
