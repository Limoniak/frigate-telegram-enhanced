# frigate-telegram-enhanced — Telegram notifications for Frigate NVR
# Documentation: https://github.com/Limoniak/frigate-telegram-enhanced
#
# docker compose up -d, then open http://<server-ip>:8431/ : the setup page asks
# for the bot token, Frigate's address and the MQTT broker. Nothing to set here.

services:
  frigate-telegram-enhanced:
    image: ghcr.io/limoniak/frigate-telegram-enhanced:1   # every 1.x release, never a breaking 2.0
    container_name: frigate-telegram-enhanced
    restart: unless-stopped
    ports:
      - "8431:8431"
    volumes:
      - frigate-telegram-enhanced-data:/data   # connection, settings and state

volumes:
  frigate-telegram-enhanced-data:
