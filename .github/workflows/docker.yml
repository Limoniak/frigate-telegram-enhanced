name: ci

on:
  push:
    # dev publishes :dev, to try changes before they reach :latest.
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local # the tools below are built with the Go of go.mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Smoke test of the web interface in Chrome, preinstalled on the ubuntu runners.
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs
      # (AppArmor): allowed again, so that Chrome runs as it does on a desktop.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test -tags browser -run Browser ./internal/web/
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest follows main, so that the provided docker-compose.yml works as is;
          # v* tags also publish :X.Y.Z and :X.Y.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
